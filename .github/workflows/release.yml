name: Release

# Build installers whenever a GitHub Release is published, and attach the
# artifacts to that release. macOS builds are signed with the ANP Labs
# Developer ID and notarized when the signing secrets are set (see
# docs/RELEASING.md); Windows builds are unsigned.
on:
  release:
    types: [published]
  # Allow building installers on demand without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installers (macOS, signed + notarized)
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Base64 of the "Developer ID Application" certificate + private key
          # exported as .p12. The script below imports it into a temp keychain.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # App Store Connect API key for notarization (the .p8 file contents).
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            # Forks and repos without the secrets still get a launchable build:
            # ad-hoc signed (an unsigned arm64 app is reported as "damaged"),
            # not notarized, and unable to apply auto-updates.
            echo "::warning::MAC_CERT_P12_BASE64 is not set; building an ad-hoc signed, non-notarized app."
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac:unsigned
            exit 0
          fi
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "::error::Signing is configured but the notarization secrets (APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER) are not all set."
            exit 1
          fi
          # Import the certificate into our own keychain instead of handing
          # CSC_LINK to electron-builder: its import runs set-key-partition-list
          # with the .p12 password where the keychain password belongs, which
          # newer macOS runners reject ("SecKeychainUnlock: The user name or
          # passphrase you entered is not correct"). With CSC_LINK unset,
          # electron-builder signs from CSC_KEYCHAIN.
          KEYCHAIN="$RUNNER_TEMP/ployd-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # The exported .p12 holds only the leaf certificate and its key; the
          # Developer ID G2 intermediate is what makes the identity "valid".
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"Developer ID Application: ANP DESENVOLVIMENTO DE SOFTWARE LTDA (Y87W583VKZ)"'; then
            echo "::error::MAC_CERT_P12_BASE64 does not hold a valid \"Developer ID Application: ANP DESENVOLVIMENTO DE SOFTWARE LTDA (Y87W583VKZ)\" identity. Export that certificate and its private key again (docs/RELEASING.md, step 2)."
            exit 1
          fi
          unset CSC_LINK CSC_KEY_PASSWORD
          export CSC_KEYCHAIN="$KEYCHAIN"

          # electron-builder wants APPLE_API_KEY as a path to the .p8 file.
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY"
          # forceCodeSigning: fail the release instead of shipping an unsigned app.
          npm run dist:mac -- -c.forceCodeSigning=true
          rm -f "$APPLE_API_KEY"
          security delete-keychain "$KEYCHAIN"
          for app in release/mac*/Ployd.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          done

      - name: Build installers (Windows, unsigned)
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keep every build's output available on the workflow run, even for
      # manual (workflow_dispatch) runs that have no release to attach to.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ployd-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.zip
          if-no-files-found: warn

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest*.yml
